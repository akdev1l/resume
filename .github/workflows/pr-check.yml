name: pr check
on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: pr-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/akdev1l/resume/resume-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - name: check out repository code
        uses: actions/checkout@v4

      - name: build pdf, launcher and web distribution
        run: |
          cmake -B build
          cmake --build build

      - name: check the install tree
        run: |
          DESTDIR="${PWD}/install-root" cmake --install build --prefix /usr
          test -x install-root/usr/bin/akdev-resume
          test -s install-root/usr/share/akdev/resume.pdf
          test -s install-root/usr/share/man/man1/akdev-resume.gz

      - name: upload rendered resume
        uses: actions/upload-artifact@v4
        with:
          name: akdev-resume-pdf
          path: ./build/main.pdf

      - name: upload web distribution
        uses: actions/upload-artifact@v4
        with:
          name: akdev-resume-web
          path: ./build/web/dist/

  rpm:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/akdev1l/resume/resume-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - name: check out repository code
        uses: actions/checkout@v4
        with:
          # rpkg derives the version from the commit count.
          fetch-depth: 0

      - name: allow rpkg to read the checkout
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: build rpm package
        run: |
          cmake -B build -DRESUME_BUILD_WEB=OFF
          cmake --build build --target rpm

      - name: upload rpm package
        uses: actions/upload-artifact@v4
        with:
          name: akdev-resume-rpm
          path: ./build/rpm/noarch

  builder-image:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: check out repository code
        uses: actions/checkout@v4

      # The builder image's toolchain comes from `dnf builddep` on the spec, so
      # a spec change can silently strip a tool the other jobs need. Build it
      # here, but leave publishing to build-resume-builder.yml.
      - name: build resume-builder container
        uses: redhat-actions/buildah-build@v2
        with:
          image: resume-builder
          tags: ${{ github.sha }}
          oci: true
          containerfiles: |
            ./Containerfile
