name: refresh resume
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'src/*'

jobs:
  build-resume:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    container: 
      image: ghcr.io/akdev1l/resume/resume-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - name: check out repository code
        uses: actions/checkout@v4

      - name: trust the workspace for git inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: render resume
        run: |
          cmake -B build -DRESUME_BUILD_WEB=OFF
          cmake --build build

      - name: push to output branch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b output
          git add -f docs/main.pdf
          git rm -rf .github/workflows
          git commit -m 'ci/cd: generated output pdf'
          git push -fu origin output

      - uses: actions/upload-artifact@v4
        with:
          name: akdev-resume
          path: ./docs/main.pdf

  build-resume-rpm:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/akdev1l/resume/resume-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - name: check out repository code
        uses: actions/checkout@v4

      - name: trust the workspace for git inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: build rpm package
        run: |
          cmake -B build -DRESUME_BUILD_WEB=OFF
          cmake --build build --target rpm

      - uses: actions/upload-artifact@v4
        with:
          name: akdev-resume-rpm
          path: ./build/rpm/noarch
